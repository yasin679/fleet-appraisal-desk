name: Mobile

on:
  push:
    paths: ["web/**", "mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Signing key (from secrets, or a throw-away key)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          [ -d "$ANDROID_HOME/platforms/android-34" ] || yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34"
          cd mobile/android && bash build-apk.sh
      - uses: actions/upload-artifact@v4
        with: { name: FleetAppraisalDesk-android, path: mobile/android/dist/*.apk }

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Web bundle and Capacitor sync
        run: |
          bash web/build.sh
          cd mobile && npm ci && npx cap sync ios
      - name: Simulator build
        run: |
          cd mobile/ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build
          cd build/sim/Build/Products/Release-iphonesimulator && zip -qr "$GITHUB_WORKSPACE/FleetAppraisalDesk-simulator.app.zip" App.app
      - name: Unsigned device build (.ipa for sideloading)
        run: |
          cd mobile/ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -derivedDataPath build/dev \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload && cp -R build/dev/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr "$GITHUB_WORKSPACE/FleetAppraisalDesk-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: FleetAppraisalDesk-ios
          path: |
            FleetAppraisalDesk-unsigned.ipa
            FleetAppraisalDesk-simulator.app.zip

  pwa:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages }
    steps:
      - uses: actions/checkout@v4
      - run: bash web/build.sh
      - uses: actions/upload-pages-artifact@v3
        with: { path: mobile/www }
      - uses: actions/deploy-pages@v4
