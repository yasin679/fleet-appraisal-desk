<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fleet Appraisal Desk</title></head><body>
<title>Fleet Appraisal Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a chart-room desk. Narrow top bar, a role tab rail, one working column; forms read like a ship's appraisal form. */
:root {
  --bg: #F2F4F5; --surface: #FFFFFF; --surface-2: #E8EDF0; --line: #D3DBE0; --line-2: #BCC7CF;
  --ink: #13212E; --ink-2: #485866; --ink-3: #6B7A86;
  --accent: #C8441A; --accent-ink: #FFFFFF; --accent-soft: #FBE6DD;
  --fleet: #2B6CB0; --fleet-soft: #DCE8F4;
  --good: #2E7D4F; --good-soft: #DFF1E6; --warn: #9A6412; --warn-soft: #FBEFD9; --crit: #B3261E; --crit-soft: #F9E0DE;
  --display: "Archivo", "Arial Narrow", Arial, sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D151C; --surface: #141F28; --surface-2: #1B2833; --line: #2A3946; --line-2: #3A4B59;
  --ink: #E3E9EE; --ink-2: #A9B6C1; --ink-3: #8394A1;
  --accent: #E8693A; --accent-ink: #160B06; --accent-soft: #3A2016;
  --fleet: #4F8FDB; --fleet-soft: #182B40;
  --good: #5CC08A; --good-soft: #15301F; --warn: #E3B04B; --warn-soft: #33270F; --crit: #F0736B; --crit-soft: #3A1715; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0D151C; --surface: #141F28; --surface-2: #1B2833; --line: #2A3946; --line-2: #3A4B59;
  --ink: #E3E9EE; --ink-2: #A9B6C1; --ink-3: #8394A1;
  --accent: #E8693A; --accent-ink: #160B06; --accent-soft: #3A2016;
  --fleet: #4F8FDB; --fleet-soft: #182B40;
  --good: #5CC08A; --good-soft: #15301F; --warn: #E3B04B; --warn-soft: #33270F; --crit: #F0736B; --crit-soft: #3A1715; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font: 15px/1.5 var(--body); margin: 0; }
h1, h2, h3 { font-family: var(--display); font-stretch: 88%; line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: 26px; font-weight: 750; }
h2 { font-size: 18px; font-weight: 700; }
h3 { font-size: 15px; font-weight: 700; }
p { margin: 0; }
a { color: var(--fleet); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--fleet); outline-offset: 2px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.eyebrow { font: 600 11px/1.2 var(--body); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
.muted { color: var(--ink-2); } .faint { color: var(--ink-3); } .small { font-size: 13px; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); color: var(--bg); }
.bar-in { max-width: 1180px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.brand { font: 750 17px/1 var(--display); font-stretch: 80%; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }
.brand svg { flex: none; }
.who { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; min-width: 0; }
.who b { font-weight: 600; } .who span { opacity: .75; }
.bar .btn-ghost { color: var(--bg); border-color: color-mix(in srgb, var(--bg) 35%, transparent); }
.tabs { max-width: 1180px; margin: 0 auto; padding: 0 16px; display: flex; gap: 2px; overflow-x: auto; }
.tabs button, .tabs a { text-decoration: none; display: inline-block; background: none; border: 0; color: var(--bg); opacity: .7; padding: 9px 12px 10px; font-weight: 600; font-size: 14px; border-bottom: 3px solid transparent; white-space: nowrap; cursor: pointer; }
.tabs button[aria-current="page"], .tabs a[aria-current="page"] { opacity: 1; border-bottom-color: var(--accent); }
.tabs button .count, .tabs a .count { font: 500 11px var(--mono); background: var(--accent); color: var(--accent-ink); border-radius: 9px; padding: 1px 6px; margin-left: 6px; }
.notice { max-width: 1148px; margin: 12px auto 0; padding: 10px 14px; border-radius: var(--r); background: var(--warn-soft); color: var(--ink); font-size: 14px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 60px; display: grid; gap: 20px; }

/* panels and grids */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.panel > h2 + *, .panel > header + * { margin-top: 12px; }
.panel header { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; justify-content: space-between; }
.grid2 { display: grid; gap: 20px; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); align-items: start; }
.cols { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
@media (max-width: 860px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.page-head { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; justify-content: space-between; }
.page-head .sub { color: var(--ink-2); margin-top: 4px; }

/* buttons, chips */
.btn { border: 1px solid var(--line-2); background: var(--surface); border-radius: var(--r); padding: 8px 14px; font-weight: 600; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.btn:hover { border-color: var(--ink-3); }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn-primary:hover { filter: brightness(1.06); border-color: var(--accent); }
.btn-ghost { background: transparent; }
.btn-sm { padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 12px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.plain::before { display: none; }
.st-goals, .st-goals_review { background: var(--fleet-soft); color: var(--fleet); }
.st-self, .st-ack { background: var(--accent-soft); color: var(--accent); }
.st-appraiser, .st-reviewer, .st-office { background: var(--warn-soft); color: var(--warn); }
.st-done { background: var(--good-soft); color: var(--good); }
.lvl { font: 600 11px var(--body); letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--line-2); border-radius: 3px; padding: 1px 6px; color: var(--ink-2); }

/* forms */
label.f { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
input[type=text], input[type=password], input[type=number], select, textarea { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r); padding: 8px 10px; width: 100%; min-width: 0; font-weight: 400; color: var(--ink); }
textarea { min-height: 64px; resize: vertical; }
input.w { width: 70px; text-align: right; font-family: var(--mono); }
.err { color: var(--crit); }
.checks { display: grid; gap: 4px; font-size: 13px; padding: 0; margin: 0; list-style: none; }
.checks li { display: flex; gap: 8px; align-items: baseline; }
.checks li::before { content: "✓"; color: var(--good); font-weight: 700; width: 12px; flex: none; }
.checks li.bad::before { content: "•"; color: var(--crit); }
.checks li.bad { color: var(--crit); }

/* tables */
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font: 600 11px/1.3 var(--body); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); padding: 8px 10px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface-2); }
td.r, th.r { text-align: right; }
tr.me td { background: var(--accent-soft); }

/* goal cards */
.goal { border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; background: var(--surface); }
.goal + .goal { margin-top: 10px; }
.goal-top { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.goal-title { font-weight: 700; font-size: 15px; }
.goal-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.cat { font: 600 11px var(--body); letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 3px; background: var(--surface-2); color: var(--ink-2); }
.cat.Safety { background: var(--crit-soft); color: var(--crit); }
.goal-edit { display: grid; gap: 8px; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) 90px auto; align-items: end; }
.goal-edit .t2 { grid-column: 1 / -1; }
@media (max-width: 640px) { .goal-edit { grid-template-columns: minmax(0, 1fr) 90px; } .goal-edit .catf { grid-column: 1 / -1; } }
.rate { display: flex; gap: 4px; flex-wrap: wrap; }
.rate button { width: 40px; height: 36px; border: 1px solid var(--line-2); background: var(--surface); border-radius: var(--r); font: 600 15px var(--mono); cursor: pointer; }
.rate button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.rate-lbl { font-size: 13px; color: var(--ink-2); min-height: 18px; }
.rate-row { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 640px) { .rate-row { grid-template-columns: minmax(0, 1fr); } }
.who-rated { font: 600 11px var(--body); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px; }
.pill5 { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.pill5 b { font: 600 14px var(--mono); width: 26px; height: 26px; display: inline-grid; place-items: center; border-radius: 50%; background: var(--surface-2); }
.pill5.s b { background: var(--accent-soft); color: var(--accent); }
.pill5.m b { background: var(--fleet-soft); color: var(--fleet); }

/* stepper */
ol.steps { list-style: none; padding: 0; margin: 0; }
.crumbs { font-size: 13px; color: var(--ink-3); margin: 0 0 10px; display: flex; gap: 6px; flex-wrap: wrap; }
.crumbs a { color: inherit; }
.crumbs span[aria-current] { color: var(--ink); font-weight: 600; }
.steps { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; }
.step { border-top: 4px solid var(--line); padding-top: 6px; font-size: 12px; color: var(--ink-3); min-width: 0; }
.step b { display: block; color: var(--ink-2); font-size: 12px; }
.step.done { border-top-color: var(--good); }
.step.now { border-top-color: var(--accent); color: var(--ink); }
.step.now b { color: var(--accent); }
.step.skip { opacity: .45; }
@media (max-width: 760px) { .steps { grid-template-columns: repeat(4, minmax(0, 1fr)); row-gap: 10px; } }

/* score tiles */
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 4px; align-content: start; }
.tile .big { font: 700 30px/1.1 var(--display); font-stretch: 85%; font-variant-numeric: tabular-nums; }
.tile .big small { font-size: 15px; color: var(--ink-3); font-weight: 600; }
.tile.hl { border-color: var(--accent); }

/* login */
#app { min-height: 100vh; min-height: 100dvh; }
.login { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); }
.login-side { background: var(--ink); color: var(--bg); padding: 40px 36px; display: grid; align-content: space-between; gap: 30px; position: relative; overflow: hidden; }
.login-side h1 { font-size: 40px; font-stretch: 78%; letter-spacing: .01em; }
.login-side p { opacity: .8; max-width: 38ch; margin-top: 12px; }
.login-side .scale { display: grid; gap: 6px; font-size: 13px; }
.login-side .scale div { display: flex; gap: 10px; align-items: center; }
.login-side .scale b { font: 600 13px var(--mono); width: 24px; height: 24px; display: grid; place-items: center; border: 1px solid color-mix(in srgb, var(--bg) 40%, transparent); border-radius: 50%; }
.login-main { padding: 36px 32px; display: grid; gap: 22px; align-content: start; max-width: 720px; }
.login-form { display: grid; gap: 12px; max-width: 380px; }
.acct-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.acct { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 10px 12px; cursor: pointer; display: grid; gap: 2px; }
.acct:hover { border-color: var(--accent); }
.acct .role { font: 600 11px var(--body); letter-spacing: .07em; text-transform: uppercase; color: var(--accent); }
.acct .nm { font-weight: 700; }
.acct .meta { font-size: 12px; color: var(--ink-3); font-family: var(--mono); }
@media (max-width: 820px) { .login { grid-template-columns: minmax(0, 1fr); } .login-side { padding: 28px 16px; } .login-side h1 { font-size: 32px; } .login-main { padding: 24px 16px; } }

/* charts */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: var(--body); }
@media (max-width: 700px) { .chart.box { min-width: 620px; } .chart.cat { min-width: 440px; } }
.chart .tick { fill: var(--ink-3); font-size: 11px; font-family: var(--mono); }
.chart .lbl { fill: var(--ink); font-size: 13px; }
.chart .lbl2 { fill: var(--ink-3); font-size: 11px; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.tip { position: fixed; pointer-events: none; z-index: 50; background: var(--ink); color: var(--bg); font-size: 12px; padding: 7px 9px; border-radius: 4px; max-width: 260px; line-height: 1.4; }
.hbar { height: 10px; border-radius: 0 3px 3px 0; background: var(--fleet); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: var(--r); font-size: 14px; z-index: 60; max-width: calc(100% - 32px); }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 13px; }
.timeline li { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 10px; }
.timeline .d { font-family: var(--mono); color: var(--ink-3); }
.empty { padding: 28px; text-align: center; color: var(--ink-2); }
.confirm { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
.filters label.f { min-width: 140px; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: 14px; }
.kv dt { color: var(--ink-3); } .kv dd { margin: 0; }
.funnel { display: grid; gap: 6px; }
.funnel div { display: grid; grid-template-columns: 150px minmax(0, 1fr) 36px; gap: 10px; align-items: center; font-size: 13px; }
.funnel .track { background: var(--surface-2); border-radius: 3px; height: 14px; }
.funnel .fill { height: 14px; border-radius: 0 3px 3px 0; background: var(--fleet); }
@media (prefers-reduced-motion: no-preference) { .wrap > * { animation: rise .25s ease-out both; } @keyframes rise { from { transform: translateY(4px); } to { transform: none; } } }
</style>
<div id="app"></div>
<script>
/* ===== Reference data: ranks, approval levels, goal templates ===== */
const YEAR = 2026;
const CATS = ["Safety", "Operations", "Compliance", "Teamwork", "Development", "Conduct"];
const SCALE = [
  { v: 1, label: "Unsatisfactory", short: "Unsatisfactory" },
  { v: 2, label: "Needs improvement", short: "Needs impr." },
  { v: 3, label: "Meets expectations", short: "Meets" },
  { v: 4, label: "Exceeds expectations", short: "Exceeds" },
  { v: 5, label: "Outstanding", short: "Outstanding" }
];
// appraiser = level 2, reviewer = level 3 (countersign), office approval = level 4 (Crewing Manager)
const RANKS = {
  MST: { name: "Master", dept: "Deck", level: "Officer", appr: "MSUPT", rev: null, next: null },
  CO: { name: "Chief Officer", dept: "Deck", level: "Officer", appr: "MST", rev: "MSUPT", next: "MST" },
  "2O": { name: "Second Officer", dept: "Deck", level: "Officer", appr: "CO", rev: "MST", next: "CO" },
  "3O": { name: "Third Officer", dept: "Deck", level: "Officer", appr: "CO", rev: "MST", next: "2O" },
  CE: { name: "Chief Engineer", dept: "Engine", level: "Officer", appr: "MST", rev: "TSUPT", next: null },
  "2E": { name: "Second Engineer", dept: "Engine", level: "Officer", appr: "CE", rev: "MST", next: "CE" },
  "3E": { name: "Third Engineer", dept: "Engine", level: "Officer", appr: "CE", rev: "MST", next: "2E" },
  "4E": { name: "Fourth Engineer", dept: "Engine", level: "Officer", appr: "CE", rev: "MST", next: "3E" },
  ETO: { name: "Electro-Technical Officer", dept: "Engine", level: "Officer", appr: "CE", rev: "MST", next: null },
  DCD: { name: "Deck Cadet", dept: "Deck", level: "Non-Officer", appr: "CO", rev: "MST", next: "3O" },
  BSN: { name: "Bosun", dept: "Deck", level: "Non-Officer", appr: "CO", rev: "MST", next: null },
  AB: { name: "Able Seaman", dept: "Deck", level: "Non-Officer", appr: "CO", rev: "MST", next: "BSN" },
  OS: { name: "Ordinary Seaman", dept: "Deck", level: "Non-Officer", appr: "CO", rev: "MST", next: "AB" },
  FTR: { name: "Fitter", dept: "Engine", level: "Non-Officer", appr: "CE", rev: "MST", next: null },
  OLR: { name: "Oiler", dept: "Engine", level: "Non-Officer", appr: "CE", rev: "MST", next: "FTR" },
  CCK: { name: "Chief Cook", dept: "Catering", level: "Non-Officer", appr: "MST", rev: null, next: null },
  MSM: { name: "Messman", dept: "Catering", level: "Non-Officer", appr: "CCK", rev: "MST", next: "CCK" }
};
const RANK_ORDER = ["MST", "CO", "2O", "3O", "CE", "2E", "3E", "4E", "ETO", "DCD", "BSN", "AB", "OS", "FTR", "OLR", "CCK", "MSM"];
const OFFICE = {
  MSUPT: { name: "Capt. Neil Fernandes", title: "Marine Superintendent" },
  TSUPT: { name: "Priya Nair", title: "Technical Superintendent" },
  CREWING: { name: "Farah Khan", title: "Crewing Manager" }
};
const VESSELS = [
  { id: "V1", name: "MV Coral Meridian", type: "Bulk carrier" },
  { id: "V2", name: "MT Aegean Dawn", type: "Product tanker" },
  { id: "V3", name: "MV Saffron Bay", type: "Container ship" },
  { id: "V4", name: "MT Nordic Tern", type: "Chemical tanker" },
  { id: "V5", name: "MV Konkan Pearl", type: "Bulk carrier" },
  { id: "V6", name: "MV Lagos Spirit", type: "Container ship" }
];
const TEMPLATES = {
  Officer: [
    { title: "Lead safe operations in my department", category: "Safety", target: "Zero lost-time injuries; 100% drills and toolbox talks; permits to work closed correctly", weight: 25 },
    { title: "Clean inspections", category: "Compliance", target: "No PSC, vetting or audit findings in my area of responsibility", weight: 20 },
    { title: "Planned work on time", category: "Operations", target: "100% of PMS jobs (engine) or voyage and cargo plans (deck) done on time", weight: 20 },
    { title: "Lead and develop the team", category: "Teamwork", target: "Familiarisation and on-board training complete for every junior I supervise", weight: 15 },
    { title: "My own development", category: "Development", target: "All assigned CBTs complete; one competence course before next contract", weight: 20 }
  ],
  "Non-Officer": [
    { title: "Work safely", category: "Safety", target: "Zero injuries; PPE and permit to work always followed; 100% drill attendance", weight: 30 },
    { title: "Assigned work done well", category: "Operations", target: "PMS jobs and daily work orders done on time and to standard", weight: 30 },
    { title: "Reliable and disciplined", category: "Conduct", target: "No warnings; work and rest hours recorded accurately", weight: 20 },
    { title: "Keep learning", category: "Development", target: "Assigned CBTs and training record book tasks complete", weight: 20 }
  ]
};
const GOAL_LIBRARY = [
  { title: "Mooring operations without incident", category: "Safety", target: "Zero mooring incidents; snap-back zones briefed before every operation", for: "Deck" },
  { title: "Enclosed space entry done right", category: "Safety", target: "100% entries with permit, gas test and rescue team ready", for: "All" },

  <div class="panel" style="max-width:720px"><h2>Reset to the starting point</h2>
  <p class="muted" style="margin-top:8px">Puts every ${YEAR} appraisal back to how the demo started, so you can run the walkthrough again: Joseph Santos (2/O) has a self-evaluation to do, Budi Kusuma (AB) has goals to set, Rahul Mehta (C/O) has evaluations waiting and the Master has countersigns waiting. Uploaded benchmark data and passwords are kept.</p>
  <div style="margin-top:14px">${S.open.reset ? `<div class="confirm"><b>Reset every appraisal for everyone?</b><span class="small">Anything people entered since the start is lost.</span><div class="actions"><button class="btn btn-primary" type="button" data-act="resetgo" ${S.busy ? "disabled" : ""}>${S.busy || "Yes, reset demo data"}</button><button class="btn btn-ghost" type="button" data-act="resetno">Cancel</button></div></div>` : `<button class="btn" type="button" data-act="reset">Reset demo data</button>`}</div></div>`;
}

/* ===== Events ===== */
function setPath(obj, path, val) { const ks = path.split("."); let o = obj; for (let i = 0; i < ks.length - 1; i++) o = o[/^\d+$/.test(ks[i]) ? +ks[i] : ks[i]]; o[ks[ks.length - 1]] = val; }
const ACT = {
  quick: d => doLogin(d.id, "demo"),
  logout: async () => { await B.logout(); S.user = null; S.edit = null; S.open = {}; S.notice = API ? "" : S.notice; S.demo = null; S.view = { name: "login", args: [] }; history.replaceState(null, "", "#login"); route(); window.scrollTo(0, 0); },
  back: () => { if (history.length > 1) history.back(); else go(defaultRoute(S.user)); },
  rate: (d, el) => {
    const a = S.edit && S.edit.app; if (!a) return;
    const v = +d.v; a.goals[+d.gi][d.key] = v;
    el.parentElement.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.v === v)));
    const l = $(`#rl-${d.key}-${d.gi}`); if (l) l.textContent = SCALE[v - 1].label;
    updateLive();
  },
  rmgoal: d => { S.edit.app.goals.splice(+d.gi, 1); S.edit.dirty = true; render(); },
  addgoal: () => { const a = S.edit.app; if (a.goals.length >= 6) return; const i = $("#libSel") ? $("#libSel").value : ""; const g = i !== "" ? GOAL_LIBRARY[+i] : { title: "", category: "Operations", target: "" }; a.goals.push({ id: "n" + Date.now().toString(36), _new: true, title: g.title, category: g.category, target: g.target, weight: 10, self: null, selfNote: "", mgr: null, mgrNote: "" }); S.edit.dirty = true; render(); const n = a.goals.length - 1; const el = $("#gt" + n); if (el) { el.scrollIntoView({ block: "center" }); if (!g.title) el.focus(); } },
  tplgoals: () => { const a = S.edit.app; a.goals = TEMPLATES[a.level].map((g, i) => ({ id: "g" + (i + 1), ...g, self: null, selfNote: "", mgr: null, mgrNote: "" })); S.edit.dirty = true; render(); },
  retopen: () => { S.open.ret = true; render(); const t = $("#retNote"); if (t) t.focus(); },
  retclose: () => { S.open.ret = false; render(); },
  do: d => doAction(d.k),
  reset: () => { S.open.reset = true; render(); },
  resetno: () => { S.open.reset = false; render(); },
  resetgo: async () => { if (S.busy) return; S.busy = "Resetting…"; S.edit = null; render(); try { await B.resetDemo(); toast("Demo data reset"); } catch (e) { toast(e.message || "Couldn't reset."); } S.busy = ""; S.open.reset = false; render(); },
  benchsave: async () => { if (S.busy) return; const src = (($("#benchSrc") || {}).value || S.upload.name).trim() || S.upload.name; S.busy = "Saving…"; render(); try { await B.saveBench(S.upload, src); S.upload = null; toast("Benchmark data saved. Every comparison now uses it."); } catch (e) { toast(e.message || "Couldn't save."); } S.busy = ""; reload(); },
  benchcancel: () => { S.upload = null; render(); },
  benchclear: async () => { try { await B.resetBench(); toast("Back to the sample benchmark"); } catch (e) { toast(e.message); } reload(); },
  copytpl: () => { const done = () => toast("Layout copied"); try { navigator.clipboard.writeText(CSV_TEMPLATE).then(done, () => selectTpl()); } catch (e) { selectTpl(); } }
};
function selectTpl() { const el = $("#csvTpl"); if (!el) return; const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Layout selected. Press Ctrl+C or Cmd+C to copy."); }

document.addEventListener("click", e => {
  const link = e.target.closest && e.target.closest("a[href^='#app.']");
  if (link) { S.from = S.view.name === "app" ? S.from : S.view.name; }
  const el = e.target.closest("[data-act]");
  if (!el || el.tagName === "INPUT") return;
  if (el.tagName === "A") e.preventDefault();
  const fn = ACT[el.dataset.act]; if (fn) fn(el.dataset, el);
});
document.addEventListener("submit", async e => {
  if (e.target.id === "loginForm") { e.preventDefault(); doLogin($("#lid").value, $("#lpw").value); }
  if (e.target.id === "pwForm") {
    e.preventDefault(); const a = $("#pw0").value, b = $("#pw1").value, c = $("#pw2").value;
    if (b !== c) { S.pwMsg = "The two new passwords don't match."; S.pwOk = false; render(); return; }
    try { await B.changePassword(a, b); S.pwMsg = "Password changed."; S.pwOk = true; } catch (err) { S.pwMsg = (err.errors && err.errors[0]) || err.message; S.pwOk = false; }
    render();
  }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.bind && S.edit && !["checkbox", "radio"].includes(t.type) && t.tagName !== "SELECT") {
    if (t.dataset.bind === "__ret") { S.edit.ret = t.value; return; }
    setPath(S.edit.app, t.dataset.bind, t.dataset.num ? (t.value === "" ? "" : parseInt(t.value, 10)) : t.value);
    updateLive(); return;
  }
  if (t.dataset.filter === "q") { S.fleetF.q = t.value; clearTimeout(t._d); t._d = setTimeout(() => { const pos = t.selectionStart; renderPending = false; render(); const n = $("#fq"); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 250); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.bind && S.edit) {
    if (t.dataset.act === "train") { const ks = t.dataset.bind.split("."); const list = S.edit.app[ks[0]][ks[1]]; const i = list.indexOf(t.dataset.t); if (t.checked && i < 0) list.push(t.dataset.t); if (!t.checked && i >= 0) list.splice(i, 1); updateLive(); return; }
    if (t.type === "radio") { setPath(S.edit.app, t.dataset.bind, t.value === "true"); updateLive(); return; }
    if (t.type === "checkbox") { setPath(S.edit.app, t.dataset.bind, t.checked); updateLive(); return; }
    if (t.tagName === "SELECT") { setPath(S.edit.app, t.dataset.bind, t.value); updateLive(); return; }
  }
  if (t.dataset.filter && t.dataset.filter !== "q") { S.fleetF[t.dataset.filter] = t.value; t.blur(); render(); return; }
  if (t.dataset.nav) { const d = S.view.data; const pid = t.dataset.nav === "person" ? t.value : d.pid; const yr = t.dataset.nav === "year" ? +t.value : (t.dataset.nav === "person" ? "" : d.yr); t.blur(); go("compare." + pid + (yr ? "." + yr : "")); return; }
  if (t.id === "benchFile" && t.files && t.files[0]) { const f = t.files[0]; f.text().then(async txt => { S.upload = await B.parseBench(txt, f.name); render(); }, () => toast("Couldn't read that file.")); }
});
let tipEl;
document.addEventListener("mousemove", e => {
  const h = e.target.closest && e.target.closest("[data-tip]");
  if (!h) { if (tipEl) tipEl.hidden = true; return; }
  if (!tipEl) { tipEl = document.createElement("div"); tipEl.className = "tip"; document.body.appendChild(tipEl); }
  tipEl.textContent = h.getAttribute("data-tip"); tipEl.hidden = false;
  const x = Math.min(e.clientX + 14, innerWidth - tipEl.offsetWidth - 8); tipEl.style.left = x + "px"; tipEl.style.top = (e.clientY + 16) + "px";
});
function afterRender() { if (tipEl) tipEl.hidden = true; }
window.addEventListener("hashchange", () => {
  if (S.edit && S.edit.dirty && S.view.name !== "login") {
    // Unsaved changes: keep them in memory; they come back if the user returns to the same appraisal at the same step.
    toast("Your unsaved changes are kept until you leave the app. Save a draft to keep them for good.");
  }
  route();
});
window.addEventListener("beforeunload", e => { if (S.edit && S.edit.dirty) { e.preventDefault(); e.returnValue = ""; } });

/* ===== Boot ===== */
render();
route();
</script>
</body></html>
